name: Build & Release RAMCore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RAMCore" --icon "icono.ico" --add-data "icono.ico;." --add-data "icono.png;." ram_optimizer.py

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RAMCore.exe -DestinationPath dist\RAMCore-windows-x64.zip -Force

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/RAMCore.exe
            dist/RAMCore-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
